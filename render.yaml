databases:
  - name: ems-postgres
    plan: free
    databaseName: emsnew
    user: emsuser

services:
  # ── Unified Python Backend (FastAPI + Chatbot) ──────────────────────────────
  - type: web
    name: ems-backend
    runtime: docker
    plan: free
    rootDir: employeemanagementsystem/ems-backend-python
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ems-postgres
          property: connectionString
      - key: JWT_SECRET
        value: Z3V2d3dxd3Vpd2V1d2V1aXdlcXVpd2V1cXVpd2V1cXVpd2V1
      - key: MAIL_USERNAME
        value: hrtektalis@gmail.com
      - key: MAIL_PASSWORD
        sync: false   # paste your Gmail app password in the Render dashboard
      - key: GROQ_API_KEY
        sync: false   # paste your Groq API key in the Render dashboard
      - key: TZ
        value: Asia/Kolkata
      - key: CORS_ALLOWED_ORIGINS
        value: https://ems-frontend-zngr.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None

  # ── React Frontend (Static Site — CDN, never sleeps) ──────────────────────
  - type: web
    name: ems-frontend
    runtime: static
    rootDir: employeemanagementsystem/ems-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ems-backend-zl35.onrender.com/api
      - key: VITE_CHATBOT_API_URL
        value: https://ems-backend-zl35.onrender.com/api/chatbot
      - key: VITE_PARSER_URL
        value: https://ems-backend-zl35.onrender.com
      - key: VITE_SESSION_TIMEOUT_MS
        value: "900000"
