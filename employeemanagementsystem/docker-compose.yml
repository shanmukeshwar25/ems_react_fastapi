version: '3.8'

services:
  backend:
    build:
      context: ./ems-backend-python
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./ems-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: ems-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
