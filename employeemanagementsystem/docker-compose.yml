version: "3.8"

services:

  db:
    image: postgres:15-alpine
    container_name: ems-react-fastapi-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-EMSNew}
    ports:
      - "5432:5432"
    volumes:
      - ems-db-data:/var/lib/postgresql/data
      # Optional: Mount your init.sql to auto-run on first startup if needed
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./ems-backend-python
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./ems-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: ems-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ems-db-data:
